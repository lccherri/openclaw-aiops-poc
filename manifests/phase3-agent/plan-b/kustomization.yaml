apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../openclaw
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service-route.yaml
images:
  - name: openclaw
    newName: ghcr.io/openclaw/openclaw
    newTag: latest          # PIN a released tag before running the tests (record it in docs/test-log.md)
