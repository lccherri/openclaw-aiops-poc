# Plan B: OpenClaw deployed directly (used if the RHOAI 3.5 starter kit fails).
# Runs under the default "restricted-v2" SCC (random UID, no capabilities, RuntimeDefault seccomp).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: aiops-poc
spec:
  replicas: 1
  strategy:
    type: Recreate            # single writer on the RWO volume
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
        app.kubernetes.io/part-of: aiops-poc
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds config and workspace rules from ConfigMaps (the source of truth is Git).
        - name: seed-config
          image: openclaw
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data/.openclaw /data/workspace
              cp /seed/config/openclaw.json5 /data/.openclaw/openclaw.json
              cp /seed/workspace/AGENTS.md /data/workspace/AGENTS.md
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: seed-config, mountPath: /seed/config }
            - { name: seed-workspace, mountPath: /seed/workspace }
      containers:
        - name: openclaw
          image: openclaw
          # VERIFY the entrypoint for the pinned image tag (official image runs `node dist/index.js`).
          command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
          ports:
            - { name: http, containerPort: 18789 }
          env:
            - { name: HOME, value: /data }
            - { name: OPENCLAW_STATE_DIR, value: /data/.openclaw }
            - { name: OPENCLAW_CONFIG_PATH, value: /data/.openclaw/openclaw.json }
            - { name: NODE_ENV, value: production }
          envFrom:
            - configMapRef: { name: openclaw-env }
            - secretRef: { name: openclaw-credentials }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: openclaw-data }
        - name: tmp
          emptyDir: {}
        - name: seed-config
          configMap: { name: openclaw-config }
        - name: seed-workspace
          configMap: { name: openclaw-workspace }
