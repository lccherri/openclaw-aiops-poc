apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
spec:
  selector:
    app.kubernetes.io/name: openclaw
  ports:
    - { name: http, port: 18789, targetPort: http }
---
# Control UI (protected by the gateway token). Edge TLS terminated by the router.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw
  namespace: openclaw
spec:
  to:
    kind: Service
    name: openclaw
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
