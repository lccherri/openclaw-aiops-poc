# Control layer 02 - identity.
# Credentials live in the restricted namespace "poc-vault" (stand-in for a real vault;
# swap the SecretStore provider for HashiCorp Vault / cloud KMS without touching the agent).
# ESO copies ONLY the keys the agent needs into "openclaw-credentials".
# The agent pod mounts no ServiceAccount token, so it cannot read Secrets itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault-reader
  namespace: openclaw
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-vault-reader
  namespace: poc-vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openclaw-agent-credentials"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-vault-reader
  namespace: poc-vault
subjects:
  - kind: ServiceAccount
    name: eso-vault-reader
    namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-vault-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: poc-vault
  namespace: openclaw
spec:
  provider:
    kubernetes:
      remoteNamespace: poc-vault
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-vault-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-credentials
  namespace: openclaw
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: poc-vault
  target:
    name: openclaw-credentials
    creationPolicy: Owner
  data:
    - secretKey: MAAS_API_KEY            # agent subscription key (quota-limited)
      remoteRef: { key: openclaw-agent-credentials, property: AGENT_MAAS_KEY }
    - secretKey: OPENCLAW_GATEWAY_TOKEN  # Control UI / gateway auth
      remoteRef: { key: openclaw-agent-credentials, property: OPENCLAW_GATEWAY_TOKEN }
    - secretKey: OPENCLAW_HOOKS_TOKEN    # Alertmanager webhook auth
      remoteRef: { key: openclaw-agent-credentials, property: OPENCLAW_HOOKS_TOKEN }
    - secretKey: AAP_MCP_TOKEN           # AAP user restricted to the catalog workflows
      remoteRef: { key: openclaw-agent-credentials, property: AAP_MCP_TOKEN }
    - secretKey: MLFLOW_TOKEN            # write-only access to the MLflow workspace
      remoteRef: { key: openclaw-agent-credentials, property: MLFLOW_TOKEN }
