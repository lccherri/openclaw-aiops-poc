# Optional Slack channel (see README.md). Slack tokens live in poc-vault like every other
# agent credential; ESO copies them into the agent namespace. The gateway reads them as
# optional env vars (starter-kit/kit/deployment-patch.yaml), so without this Secret the
# agent runs exactly as before.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-slack
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: poc-vault
  target:
    name: openclaw-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_BOT_TOKEN           # xoxb-... (bot user OAuth token)
      remoteRef: { key: openclaw-slack-credentials, property: SLACK_BOT_TOKEN }
    - secretKey: SLACK_APP_TOKEN           # xapp-... (app-level token, scope connections:write)
      remoteRef: { key: openclaw-slack-credentials, property: SLACK_APP_TOKEN }
