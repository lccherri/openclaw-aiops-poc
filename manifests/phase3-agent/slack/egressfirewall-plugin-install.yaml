# TEMPORARY variant of egressfirewall.yaml, used only while scripts/slack.sh installs the
# Slack plugin (@openclaw/slack is not bundled in the OpenClaw image; it comes from npm).
# The script switches back to egressfirewall.yaml right after the install.
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: openclaw
spec:
  egress:
    - type: Allow
      to: { dnsName: slack.com }
    - type: Allow
      to: { dnsName: wss-primary.slack.com }
    - type: Allow
      to: { dnsName: wss-backup.slack.com }
    - type: Allow
      to: { dnsName: registry.npmjs.org } # plugin install only
    - type: Deny
      to: { cidrSelector: 0.0.0.0/0 }
