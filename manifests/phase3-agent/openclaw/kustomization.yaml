# Agent configuration as ConfigMaps (shared by plan A starter kit and plan B).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openclaw
configMapGenerator:
  - name: openclaw-config
    files:
      - openclaw.json5
  - name: openclaw-workspace
    files:
      - workspace/AGENTS.md
  - name: openclaw-env
    envs:
      - agent.env          # git-ignored; created by `make render`
