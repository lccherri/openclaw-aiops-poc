# Kubernetes/OpenShift MCP server (containers/kubernetes-mcp-server, the upstream of the
# Red Hat openshift-mcp-server). --read-only exposes no mutating tools at all
# (defense in depth on top of RBAC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp
  namespace: aiops-tools
  labels:
    app.kubernetes.io/name: kubernetes-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp
    spec:
      serviceAccountName: kubernetes-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: kubernetes-mcp-server
          args:
            - --config=/etc/kubernetes-mcp/config.toml
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/kubernetes-mcp, readOnly: true }
      volumes:
        - name: config
          configMap: { name: kubernetes-mcp-config }
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp
  namespace: aiops-tools
spec:
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - { name: http, port: 8080, targetPort: http }
