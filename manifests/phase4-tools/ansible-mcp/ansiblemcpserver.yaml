# Ansible MCP server (GA in AAP 2.6, June 2026 update) - schema validated with `oc explain`.
# The server forwards each MCP call to AAP with the CALLER's token, so the agent can only do
# what the AAP user "openclaw-agent" may do: launch the 3 approval workflows and the
# read-only collect-diagnostics template (verified: set-memory-limit -> HTTP 403).
# In-cluster only (no Route); the agent namespace is allowed by NetworkPolicy.
apiVersion: mcpserver.ansible.com/v1alpha1
kind: AnsibleMCPServer
metadata:
  name: aap-mcp
  namespace: aap
spec:
  public_base_url: http://aap.aap.svc.cluster.local   # AAP Platform Gateway (internal Service)
  allow_write_operations: true      # needed to launch workflows; AAP RBAC limits the scope
  ingress_type: none
  service_type: ClusterIP
