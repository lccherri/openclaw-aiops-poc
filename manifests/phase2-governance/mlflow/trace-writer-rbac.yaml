# Identity used by OpenClaw to send traces to MLflow. It can only write to the
# MLflow workspace of the "openclaw" namespace (VERIFY resource names in the MLflow docs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-trace-writer
  namespace: openclaw
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-trace-writer
  namespace: openclaw
rules:
  - apiGroups: ["mlflow.kubeflow.org"]        # VERIFY
    resources: ["experiments", "traces"]      # VERIFY
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-trace-writer
  namespace: openclaw
subjects:
  - kind: ServiceAccount
    name: mlflow-trace-writer
    namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-trace-writer
