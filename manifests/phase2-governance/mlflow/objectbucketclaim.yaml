# S3 bucket for MLflow artifacts, provided by ODF Multicloud Object Gateway (NooBaa).
# The OBC creates a Secret + ConfigMap named "mlflow-artifacts" with the S3 credentials/endpoint.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: mlflow-artifacts
  namespace: redhat-ods-applications
spec:
  generateBucketName: mlflow-artifacts
  storageClassName: openshift-storage.noobaa.io
