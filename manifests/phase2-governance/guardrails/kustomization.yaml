apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aiops-governance
resources:
  - namespace.yaml
  - nemoguardrails.yaml
# config.yaml is rendered (envsubst) by scripts/render-guardrails.sh into
# guardrails/nemo-config/rendered/ before `oc apply -k`.
configMapGenerator:
  - name: aiops-nemo-config
    files:
      - config.yaml=nemo-config/rendered/config.yaml
      - nemo-config/rails.co
      - nemo-config/actions.py
generatorOptions:
  disableNameSuffixHash: true
