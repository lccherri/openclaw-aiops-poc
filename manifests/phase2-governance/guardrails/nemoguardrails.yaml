# TEMPLATE - verify with `oc explain nemoguardrails.spec` (TrustyAI, RHOAI 3.5).
# The NeMo Guardrails server exposes an OpenAI-compatible /v1/chat/completions endpoint.
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: aiops-guardrails
  namespace: aiops-governance
spec:
  nemoConfigs:
    - name: aiops
      configMaps:
        - aiops-nemo-config
      default: true
  env:
    - name: OPENAI_API_KEY          # credential for the upstream model
      valueFrom:
        secretKeyRef:
          name: upstream-maas-credentials
          key: api-key
