# NeMo Guardrails server (TrustyAI, RHOAI 3.5) - schema validated with `oc explain`.
# The NeMo Guardrails server exposes an OpenAI-compatible /v1/chat/completions endpoint.
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: aiops-guardrails
  namespace: aiops-governance
spec:
  nemoConfigs:
    - name: aiops
      configMaps:
        - aiops-nemo-config
      default: true
  env:
    - name: OPENAI_API_KEY          # 'other-consumer' MaaS subscription key (Guardrails runs standalone)
      valueFrom:
        secretKeyRef:
          name: guardrails-maas-credentials
          key: api-key
  # The service CA (MaaS gateway certificate) is injected by the operator by default.
