# TEMPLATE - verify kind/fields with `oc explain` (MaaS external models are Technology Preview in 3.5).
# Registers the internal Red Hat MaaS model as an external model served through the MaaS gateway.
apiVersion: maas.opendatahub.io/v1alpha1     # VERIFY
kind: ExternalModel                          # VERIFY
metadata:
  name: aiops-model
  namespace: aiops-models
spec:
  displayName: AIOps POC model (internal MaaS)
  # Topology A: point to the NeMo Guardrails service (guardrails in front of the model).
  # Topology B: point straight to MAAS_INTERNAL_URL.
  endpoint: https://REPLACE_ME/v1            # VERIFY / replace
  modelName: REPLACE_WITH_MAAS_MODEL
  credentialsSecretRef:
    name: upstream-maas-credentials
    key: api-key
