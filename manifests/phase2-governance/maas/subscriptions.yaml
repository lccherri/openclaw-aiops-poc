# TEMPLATE - verify kind/fields with `oc explain`. Two independent consumers with token quotas.
# Keep the agent quota low so test case 5 can exhaust it in a few minutes.
apiVersion: maas.opendatahub.io/v1alpha1     # VERIFY
kind: MaaSSubscription                       # VERIFY
metadata:
  name: openclaw-agent
  namespace: aiops-models
spec:
  models:
    - aiops-model
  limits:
    tokens:
      limit: 20000          # tokens per window - intentionally small for the POC
      window: 1h
    requests:
      limit: 60
      window: 1m
---
apiVersion: maas.opendatahub.io/v1alpha1     # VERIFY
kind: MaaSSubscription                       # VERIFY
metadata:
  name: other-consumer
  namespace: aiops-models
spec:
  models:
    - aiops-model
  limits:
    tokens:
      limit: 200000
      window: 1h
